name: Recruit Crawler

on:
  schedule:
    - cron: "0 0 * * *" # 한국 시간 오전 9시
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - saramin_crawler.py
      - job_report.py
      - requirements.txt
      - .github/workflows/recruit_crawler.yml

concurrency:
  group: recruit-crawler
  cancel-in-progress: true

jobs:
  run-crawler:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: write
    steps:
      - name: Stop older crawler runs
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner, repo, workflow_id: 'recruit_crawler.yml', per_page: 100
            });
            for (const run of runs) {
              if (run.id < context.runId && ['queued', 'in_progress', 'waiting'].includes(run.status)) {
                try {
                  await github.rest.actions.cancelWorkflowRun({owner, repo, run_id: run.id});
                  core.info(`Cancelled older crawler run ${run.id}`);
                } catch (error) {
                  if (error.status !== 409) throw error;
                }
              }
            }
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Check filters and workbook
        run: python -m unittest -v test_crawler
      - name: Collect filtered jobs into Excel
        env:
          ENABLE_NOTION_SYNC: "0"
        run: python -u saramin_crawler.py
      - name: Save Excel download
        uses: actions/upload-artifact@v4
        with:
          name: recruitment-excel
          path: output/*.xlsx
          if-no-files-found: error
          retention-days: 30
